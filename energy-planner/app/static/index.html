<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy Planner</title>
<link rel="stylesheet" href="static/style.css?v={{VERSION}}">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="16" height="12" rx="3"/><rect x="19.5" y="10" width="2" height="4" rx="1"/><path d="M11.5 8.5 8.5 12.5h3l-1 3 3-4h-3z"/></svg>
      <div>
        <h1>Energy Planner</h1>
        <div class="sub"><span class="pill" title="Planen beregnes og vises, men intet skrives til inverteren eller laderen">Dry-run</span><span id="updated" class="muted"></span></div>
      </div>
    </div>
    <button id="run" class="btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg><span>Kør nu</span></button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">Plan</button>
    <button role="tab" data-tab="bil" aria-selected="false">Bil</button>
    <button role="tab" data-tab="okonomi" aria-selected="false">Økonomi</button>
    <button role="tab" data-tab="evaluering" aria-selected="false">Evaluering</button>
  </nav>

  <main>
    <section id="tab-plan" class="tab" role="tabpanel"></section>
    <section id="tab-bil" class="tab" role="tabpanel" hidden></section>
    <section id="tab-okonomi" class="tab" role="tabpanel" hidden></section>
    <section id="tab-evaluering" class="tab" role="tabpanel" hidden></section>
  </main>
</div>
<div id="tooltip" class="tooltip" role="status" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="static/app.js?v={{VERSION}}"></script>
</body>
</html>
