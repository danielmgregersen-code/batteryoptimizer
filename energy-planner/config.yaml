name: "Energy Planner"
description: "Hour-by-hour planning of a Growatt hybrid inverter, home battery and EV charging (dry-run)."
version: "0.3.5"
slug: "energy_planner"
init: false
arch:
  - aarch64
  - amd64

ingress: true
ingress_port: 8010
ingress_stream: false

panel_icon: "mdi:solar-power-variant"
panel_title: "Energy Planner"

options:
  price_buy_entity: "sensor.kob_af_el"
  price_sell_entity: "sensor.salg_af_el"
  solcast_entities: "sensor.solcast_pv_forecast_forecast_today,sensor.solcast_pv_forecast_forecast_tomorrow,sensor.solcast_pv_forecast_forecast_day_3"
  battery_soc_entity: "sensor.growatt_battery_soc"
  house_load_entity: "sensor.growatt_total_house_load"
  car_power_entity: "sensor.garage_growatt_thor_ev_charger_charging_power"
  car_detect_kw: 4.0
  charger_power_entity: "sensor.garage_growatt_thor_ev_charger_charging_power"
  reg_battery_first: "select.growatt_battery_first_time_2"
  reg_max_soc: "number.growatt_battery_first_maximum_soc"
  reg_min_soc: "number.growatt_load_first_battery_minimum_soc"
  reg_charge_rate: "number.growatt_battery_first_charge_rate"
  reg_grid_charge: "select.growatt_battery_first_charge_from_grid"
  reg_export_limit: "number.growatt_grid_export_limit"
  battery_capacity_kwh: 7.75
  battery_max_power_kw: 4.0
  inverter_kw: 10.0
  soc_floor_pct: 10
  soc_ceiling_pct: 100
  eta_pv_to_battery: 0.97
  eta_grid_to_battery: 0.94
  eta_battery_to_load: 0.95
  wear_cost_dkk_per_kwh: 0.25
  pv_p10_weight: 0.3
  profile_days: 28
  default_load_kw: 0.8
  load_includes_battery_charging: "no"
  interval_minutes: 15
  min_horizon_hours: 30
  counter_entities: "sensor.growatt_total_grid_import,sensor.growatt_total_grid_export,sensor.growatt_total_battery_input_energy,sensor.growatt_total_battery_output_energy,sensor.growatt_total_solar_energy"
  grid_import_counter: "sensor.growatt_total_grid_import"
  grid_export_counter: "sensor.growatt_total_grid_export"
  battery_input_counter: "sensor.growatt_total_battery_input_energy"
  battery_output_counter: "sensor.growatt_total_battery_output_energy"
  solar_counter: "sensor.growatt_total_solar_energy"
  car_enabled: true
  car_soc_entity: "sensor.ioniq_9_ev_battery_level"
  charger_status_entity: "sensor.garage_growatt_thor_ev_charger_status"
  charger_current_entity: "number.garage_growatt_thor_ev_charger_maximum_current"
  charger_start_button: "button.garage_growatt_thor_ev_charger_start_charging"
  pv_power_entity: "sensor.growatt_pv_power_total"
  battery_charge_power_entity: "sensor.growatt_battery_charge_power"
  car_battery_kwh: 110.0
  car_phases: 3
  car_min_amps: 6
  car_max_amps: 16
  car_eta: 0.92
  car_critical_start_pct: 20
  car_critical_stop_pct: 22
  car_min_start_pct: 40
  car_min_stop_pct: 42
  car_max_soc_pct: 90
  car_deadline_hour: 6
  car_value_dkk_per_kwh: 1.25
  car_from_house_battery: false
  car_start_surplus_w: 4200
  car_stop_surplus_w: 1500
  car_buffer_soc: 50
  car_house_priority_soc: 80
  car_house_min_soc: 30
  car_min_charge_s: 1200
  car_cooldown_s: 1800
  car_interval_seconds: 120

schema:
  price_buy_entity: str
  price_sell_entity: str
  solcast_entities: str
  battery_soc_entity: str
  house_load_entity: str
  car_power_entity: str
  car_detect_kw: float(1,22)
  charger_power_entity: str
  reg_battery_first: str
  reg_max_soc: str
  reg_min_soc: str
  reg_charge_rate: str
  reg_grid_charge: str
  reg_export_limit: str
  battery_capacity_kwh: float(1,100)
  battery_max_power_kw: float(0.5,50)
  inverter_kw: float(1,50)
  soc_floor_pct: int(0,50)
  soc_ceiling_pct: int(50,100)
  eta_pv_to_battery: float(0.5,1)
  eta_grid_to_battery: float(0.5,1)
  eta_battery_to_load: float(0.5,1)
  wear_cost_dkk_per_kwh: float(0,5)
  pv_p10_weight: float(0,1)
  profile_days: int(7,120)
  default_load_kw: float(0.1,10)
  load_includes_battery_charging: list(auto|yes|no)
  interval_minutes: int(5,60)
  min_horizon_hours: int(12,48)
  counter_entities: str
  grid_import_counter: str
  grid_export_counter: str
  battery_input_counter: str
  battery_output_counter: str
  solar_counter: str
  car_enabled: bool
  car_soc_entity: str
  charger_status_entity: str
  charger_current_entity: str
  charger_start_button: str
  pv_power_entity: str
  battery_charge_power_entity: str
  car_battery_kwh: float(10,200)
  car_phases: list(1|3)
  car_min_amps: int(6,32)
  car_max_amps: int(6,32)
  car_eta: float(0.7,1)
  car_critical_start_pct: int(0,100)
  car_critical_stop_pct: int(0,100)
  car_min_start_pct: int(0,100)
  car_min_stop_pct: int(0,100)
  car_max_soc_pct: int(50,100)
  car_deadline_hour: int(0,23)
  car_value_dkk_per_kwh: float(0,10)
  car_from_house_battery: bool
  car_start_surplus_w: int(0,22000)
  car_stop_surplus_w: int(0,22000)
  car_buffer_soc: int(0,100)
  car_house_priority_soc: int(0,100)
  car_house_min_soc: int(0,100)
  car_min_charge_s: int(0,7200)
  car_cooldown_s: int(0,7200)
  car_interval_seconds: int(30,900)

homeassistant_api: true

startup: application
boot: auto
